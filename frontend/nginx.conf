server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API, Swagger and health are forwarded to the FastAPI container,
    # so the browser talks to one origin and no CORS setup is needed.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(docs|redoc|openapi.json|health) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths load index.html and React Router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }
}
